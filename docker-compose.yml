# Bizora stack
#   cp backend/.env.production.example backend/.env   # fill secrets
#   # HTTPS: put Caddy/Cloudflare in front — see docs/DEPLOY_HTTPS.md
#   export VITE_API_URL=https://api.yourdomain.com
#   docker compose --profile full build --build-arg VITE_API_URL=$VITE_API_URL
#   docker compose --profile full up -d
#
# Local HTTP (dev-like):
#   docker compose up --build
#   Web :8080  Admin :8081 (profile full)  API :3001
#
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - backend/.env
    environment:
      NODE_ENV: production
      PORT: "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ""
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
      args:
        VITE_API_URL: ""
    ports:
      - "8081:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - full
