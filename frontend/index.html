  <body class="text-slate-900 antialiased selection:bg-indigo-100 selection:text-indigo-900">
    <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

  <!-- PWA Service Worker: skip on localhost so Vite HMR is never blocked by stale SW cache -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        if (isLocal) {
          navigator.serviceWorker.getRegistrations().then((regs) => {
            regs.forEach((r) => r.unregister());
          });
          if (window.caches) {
            caches.keys().then((keys) => keys.forEach((k) => caches.delete(k)));
          }
          console.log('Bizora: service worker unregistered on localhost (dev mode)');
          return;
        }
        navigator.serviceWorker.register('/sw.js')
          .then((registration) => {
            console.log('Bizora Service Worker registered successfully on scope:', registration.scope);
          })
          .catch((error) => {
            console.error('Bizora Service Worker registration failed:', error);
          });
      });
    }
  </script>
</body>
