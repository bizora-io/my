<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bizoraGradMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="50%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#003B99"/>
    </linearGradient>
    <linearGradient id="bizoraGradFold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0047B3"/>
      <stop offset="100%" stop-color="#00A3FF"/>
    </linearGradient>
    <linearGradient id="bizoraGradArrow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#002D80"/>
    </linearGradient>
  </defs>

  <!-- Top-left digital pixels -->
  <rect x="150" y="80" width="48" height="48" rx="8" fill="#00D2FF"/>
  <rect x="90" y="125" width="36" height="36" rx="6" fill="#00A3FF"/>
  <rect x="120" y="170" width="32" height="32" rx="6" fill="#0077B6"/>

  <!-- Main 'B' stem and top curve -->
  <path d="M210 110 H 350 C 420 110 460 150 460 215 C 460 270 425 305 375 320 C 440 335 480 380 480 450 C 480 530 410 575 325 575 H 200 C 180 575 165 560 165 540 L 165 145 C 165 125 185 110 210 110 Z" fill="url(#bizoraGradMain)"/>

  <!-- Lower swoop / loop of B -->
  <path d="M 210 110 L 340 110 C 410 110 450 150 450 215 C 450 270 415 305 360 320 C 430 340 470 385 470 455 C 470 530 405 570 320 570 H 180 C 150 570 140 540 160 510 C 200 450 250 380 300 320 L 210 110 Z" fill="url(#bizoraGradFold)" opacity="0.3"/>

  <!-- Inner negative space cutout with upward dynamic arrow -->
  <path d="M 250 170 H 330 C 370 170 395 190 395 220 C 395 250 370 270 330 270 H 250 Z" fill="#FFFFFF"/>
  <path d="M 250 350 H 340 C 385 350 410 375 410 415 C 410 455 385 485 335 485 H 250 Z" fill="#FFFFFF"/>

  <!-- Upward forward momentum arrow -->
  <path d="M 220 380 L 360 240 M 360 240 L 290 240 M 360 240 L 360 310" stroke="url(#bizoraGradArrow)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
</svg>