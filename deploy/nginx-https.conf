# Bizora — Nginx TLS sample (Certbot will adjust certificate paths)
# Upstream API on 127.0.0.1:3001

upstream bizora_api {
  server 127.0.0.1:3001;
  keepalive 32;
}

# Redirect HTTP → HTTPS
server {
  listen 80;
  server_name app.yourdomain.com admin.yourdomain.com api.yourdomain.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name api.yourdomain.com;

  ssl_certificate     /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  location / {
    proxy_pass http://bizora_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;
  }
}

server {
  listen 443 ssl http2;
  server_name app.yourdomain.com;

  ssl_certificate     /etc/letsencrypt/live/app.yourdomain.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/app.yourdomain.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;

  root /var/www/bizora-app;
  index index.html;

  location /api/ {
    proxy_pass http://bizora_api/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 443 ssl http2;
  server_name admin.yourdomain.com;

  ssl_certificate     /etc/letsencrypt/live/admin.yourdomain.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/admin.yourdomain.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;

  root /var/www/bizora-admin;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
